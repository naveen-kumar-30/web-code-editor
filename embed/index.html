<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Self-Hosted Judge0 IDE Integration</title>
    <style>
        :root {
            --judge0-blue: #2B3A8F;
            --judge0-cyan: #00BDD2;
            --judge0-pink: #ED2079;
            --judge0-violet: #5F3282;
        }

        html, body {
            height: 100%;
            margin: 0;
            min-height: 100%;
            padding: 0;
        }

        .judge0-gradient {
            background: var(--judge0-cyan) !important;
            background: linear-gradient(45deg, var(--judge0-cyan) 0%, var(--judge0-blue) 40%, var(--judge0-violet) 70%, var(--judge0-pink) 100%) !important;
        }

        #site-header {
            padding-left: 2.5rem;
            padding-right: 2.5rem;
        }

        #site-logo {
            width: 5rem;
        }

        #site-footer, .lm_tab {
            font-family: "JetBrains Mono" !important;
        }

        .lm_tab {
            box-shadow: none !important;
        }
    </style>
</head>
<body>
    <!-- Embedding Judge0 IDE in an iframe -->
    <iframe id="judge0-ide" src="http://localhost:2358" width="100%" height="600px"></iframe>

    <!-- A heading for the data viewer section -->
    <h4>Data From My Self-Hosted Judge0 IDE</h4>

    <!-- Button to trigger data retrieval from Judge0 IDE -->
    <button onclick="getDataFromJudge0IDE()">Get Data</button>

    <!-- Preformatted text element to display data retrieved from Judge0 IDE -->
    <pre id="judge0-ide-data-viewer"></pre>

    <!-- JavaScript to handle communication with the Judge0 IDE iframe -->
    <script>
        let iframeDataViewer = document.getElementById("judge0-ide-data-viewer");
        let judge0IDE = document.getElementById("judge0-ide");

        window.onmessage = function(e) {
            if (!e.data) {
                return;
            }

            iframeDataViewer.innerHTML = JSON.stringify(e.data, null, 2);

            if (e.data.event === "initialised") {
                // Make sure to only post data after the IDE is initialised
                judge0IDE.contentWindow.postMessage({
                    action: "set",
                    api_key: "", // Set your API key here
                    source_code: "Welcome!",
                    language_id: 43,
                    flavor: "CE",
                    stdin: "Hello, World!",
                    stdout: "",
                    compiler_options: "",
                    command_line_arguments: "",
                }, '*');
            }
        };

        function getDataFromJudge0IDE() {
            judge0IDE.contentWindow.postMessage({action: "get"}, '*');
        }
    </script>
</body>
</html>
