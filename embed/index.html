<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Self-Hosted Nexus IDE Integration</title>
    <style>
        :root {
            --nexus-blue: #2B3A8F;
            --nexus-cyan: #00BDD2;
            --nexus-pink: #ED2079;
            --nexus-violet: #5F3282;
        }

        html, body {
            height: 100%;
            margin: 0;
            min-height: 100%;
            padding: 0;
        }

        .nexus-gradient {
            background: var(--nexus-cyan) !important;
            background: linear-gradient(45deg, var(--nexus-cyan) 0%, var(--nexus-blue) 40%, var(--nexus-violet) 70%, var(--nexus-pink) 100%) !important;
        }

        #site-header {
            padding-left: 2.5rem;
            padding-right: 2.5rem;
        }

        #site-footer, .lm_tab {
            font-family: "JetBrains Mono" !important;
        }

        .lm_tab {
            box-shadow: none !important;
        }

        #site-logo {
            width: 5rem;
            padding-right: 1rem;
        }
    </style>
</head>
<body>
    <!-- Navigation bar with logo -->
    <div id="site-navigation" class="ui top attached inverted borderless tiny menu">
        <div class="item">
            <div class="ui input">
                <select id="select-language" class="ui dropdown"></select>
            </div>
        </div>
        <div class="item">
            <div class="ui input">
                <input id="command-line-arguments" type="text" placeholder="Command line arguments"></input>
            </div>
        </div>
        <div class="item fitted">
            <button id="run-btn" class="ui primary labeled icon button nexus-gradient" data-inverted="" data-tooltip="+↵" data-position="bottom center"><i class="play icon"></i>Run Code</button>
        </div>
        <div class="item">
            <button id="open-btn" class="ui labeled icon button" data-inverted="" data-tooltip="+O" data-position="bottom center"><i class="file icon"></i>Open File</button>
            <input type="file" id="open-file-input" style="display: none;">
        </div>
        <div class="item fitted">
            <button id="save-btn" class="ui labeled icon button" data-inverted="" data-tooltip="+S" data-position="bottom center"><i class="save icon"></i>Save File</button>
        </div>
    </div>

    <div id="site-content"></div>

    <div id="site-modal" class="ui modal">
        <div class="header">
            <span id="title"></span>
        </div>
        <div class="scrolling content"></div>
        <div class="actions">
            <a id="report-problem-btn" class="ui labeled icon red button" href="https://github.com/nexus/ide/issues/new?title=New+bug+report&body=Describe+the+problem." target="_blank">
                <i class="flag icon"></i>
                Report Problem
            </a>
            <div class="ui labeled icon cancel secondary button">
                <i class="close icon"></i>
                Close (ESC)
            </div>
        </div>
    </div>

    <div id="site-footer" class="ui bottom attached inverted borderless mini menu">
        <div class="right menu">
            <div id="status-line" class="item"></div>
        </div>
    </div>

    <!-- Embedding Nexus IDE in an iframe -->
    <iframe id="nexus-ide" src="http://localhost:2358" width="100%" height="600px"></iframe>

    <!-- A heading for the data viewer section -->
    <h4>Data From My Self-Hosted Nexus IDE</h4>

    <!-- Button to trigger data retrieval from Nexus IDE -->
    <button onclick="getDataFromNexusIDE()">Get Data</button>

    <!-- Preformatted text element to display data retrieved from Nexus IDE -->
    <pre id="nexus-ide-data-viewer"></pre>

    <!-- JavaScript to handle communication with the Nexus IDE iframe -->
    <script>
        let iframeDataViewer = document.getElementById("nexus-ide-data-viewer");
        let nexusIDE = document.getElementById("nexus-ide");

        window.onmessage = function(e) {
            if (!e.data) {
                return;
            }

            iframeDataViewer.innerHTML = JSON.stringify(e.data, null, 2);

            if (e.data.event === "initialised") {
                // Make sure to only post data after the IDE is initialised
                nexusIDE.contentWindow.postMessage({
                    action: "set",
                    api_key: "", // Set your API key here
                    source_code: "Welcome!",
                    language_id: 43,
                    flavor: "CE",
                    stdin: "Hello, World!",
                    stdout: "",
                    compiler_options: "",
                    command_line_arguments: "",
                }, '*');
            }
        };

        function getDataFromNexusIDE() {
            nexusIDE.contentWindow.postMessage({action: "get"}, '*');
        }
    </script>
</body>
</html>
